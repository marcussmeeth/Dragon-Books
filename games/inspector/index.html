<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#6e2433">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dragon Books">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Last Course · Dragon Books</title>
<link rel="stylesheet" href="../../shared/chars.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hud">
  <a class="back" href="../../index.html">← Shelf</a>
  <div class="title">The Last Course</div>
  <div class="stat">🕰️ <b id="clock">8:40</b></div>
  <div class="stat">❓ <b id="turns">16</b> left</div>
  <div class="stat tension" title="If this fills, you are shown the door">😠 <span class="bar"><i id="tension"></i></span></div>
</header>
<main>
  <section id="scene" aria-label="The dining room"></section>
  <section class="panel">
    <div id="speech" class="speech"><span class="who">Inspector Quill</span><p>Tap a diner to begin.</p></div>
    <div id="actions" class="actions"></div>
    <div id="evid" class="evid hidden"></div>
  </section>
  <aside class="panel notebook">
    <h2>Notebook</h2>
    <ul id="notes"></ul>
    <h2>Evidence</h2>
    <ul id="items"></ul>
  </aside>
</main>
<div id="modal" class="modal hidden"><div class="card" id="card"></div></div>
<script type="module" src="main.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('../../sw.js').catch(() => {});</script>
</body>
</html>
