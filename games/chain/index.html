<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#6e2433">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dragon Books">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chain Reaction · Dragon Books</title>
<link rel="stylesheet" href="../../shared/chars.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hud">
  <a class="back" href="../../index.html">← Shelf</a>
  <div class="title" id="lname">Chain Reaction</div>
  <div class="stat">Round <b id="round">1</b></div>
  <div class="stat siphon" title="Data stolen. At 100% the mission fails">🤖 <span class="bar"><i id="siphon"></i></span> <b id="spct">0%</b></div>
</header>
<main>
  <section id="board" aria-label="Level"></section>
  <section class="panel controls">
    <div id="crew" class="crew"></div>
    <div id="actions" class="actions"></div>
    <button id="end" class="end">End round ⏭</button>
  </section>
  <aside class="panel">
    <h2>Objectives</h2><ul id="goals"></ul>
    <h2>Log</h2><ol id="log"></ol>
  </aside>
</main>
<div id="modal" class="modal hidden"><div class="card" id="card"></div></div>
<script type="module" src="main.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('../../sw.js').catch(() => {});</script>
</body>
</html>
