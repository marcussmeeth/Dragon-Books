name: Deploy web version
# Publishes the games to GitHub Pages so they can be played in any browser and installed
# on a phone or tablet home screen ("Add to Home Screen").
# Pages on private repos needs a paid GitHub plan; on a public repo it is free.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: npm test
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons shared games _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
